const tr = value => value;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const svg = d3.select('#svg'), g = svg.append('g');
const zoom = d3.zoom().scaleExtent([.03, 3]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom).on('dblclick.zoom', null);
const root = d3.hierarchy(DATA);
const DX = 58, DY = 360;
const layout = d3.tree().nodeSize([DX, DY]).separation((a, b) => (a.parent === b.parent ? 1 : 2)
  + Math.max(0, (a.data.spouses || []).length - 1, (b.data.spouses || []).length - 1) / 2);
const ALL = root.descendants();
ALL.forEach((d, i) => { d.id = i; d._children = d.children; if (d.depth >= 2) d.children = null; });
const color = () => 'var(--ac)';
const PEOPLE = ALL.flatMap(d => [d, ...(d.data.spouses || []).map(s => ({data:s, owner:d}))]);
document.getElementById('names').innerHTML = PEOPLE.map(d => `<option value="${esc(d.data.name)}">`).join('');
let selected = null;

function update(src, center) {
  layout(root);
  const nodes = root.descendants(), links = root.links();
  const t = svg.transition().duration(300);
  const link = g.selectAll('path.link').data(links, d => d.target.id);
  link.join(
    en => en.insert('path', 'g').attr('class', 'link').attr('d', () => diag({x: src.x0 ?? src.x, y: src.y0 ?? src.y}, {x: src.x0 ?? src.x, y: src.y0 ?? src.y})),
    up => up, ex => ex.transition(t).remove().attr('d', () => diag(src, src))
  ).transition(t).attr('d', d => diag(d.source, d.target));
  const node = g.selectAll('g.node').data(nodes, d => d.id);
  const en = node.enter().append('g').attr('class', d => 'node')
    .attr('transform', `translate(${src.y0 ?? src.y},${src.x0 ?? src.x})`);
  en.append('circle').attr('r', 6).on('click', (e, d) => { toggle(d); update(d); });
  const tx = en.append('text').attr('class', 'name').attr('x', 11).attr('dy', '-.1em').on('click', (e, d) => { toggle(d); update(d); });
  tx.append('tspan').text(d => d.data.name);
  en.append('text').attr('class', 'yrs').attr('x', 11).attr('dy', '1.1em');
  node.merge(en).select('text.name tspan').text(d => tr(d.data.name));
  node.merge(en).select('text.yrs').text(d => d.data.years || '')
    .each(function(d) {
      const el = d3.select(this);
      (d.data.spouses || []).forEach(s => el.append('tspan').attr('x', 11).attr('dy', '1.4em')
        .attr('class', 'sp').attr('role', 'button').attr('tabindex', 0).text('∞ ' + s.name)
        .attr('aria-label', 'Information about ' + s.name)
        .on('click', (e) => { e.stopPropagation(); select(PEOPLE.find(p => p.data.key === s.key)); })
        .on('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault(); select(PEOPLE.find(p => p.data.key === s.key)); } }));
    });
  en.append('text').attr('class', 'info').attr('x', -18).attr('dy', '.35em')
    .attr('text-anchor', 'middle').attr('role', 'button').attr('tabindex', 0).text('ⓘ')
    .on('click', (e, d) => { e.stopPropagation(); select(d); })
    .on('keydown', (e, d) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(d); } })
    .append('title');
  node.merge(en).select('text.info').attr('aria-label', d => tr('Information about ') + tr(d.data.name))
    .select('title').text(d => tr('Information about ') + tr(d.data.name));
  node.merge(en).select('text.name').attr('role', d => d._children ? 'button' : null)
    .attr('tabindex', d => d._children ? 0 : null).attr('aria-expanded', d => d._children ? String(!!d.children) : null)
    .on('keydown', (e, d) => { if (d._children && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(d); update(d); } });
  node.merge(en).classed('sel', d => d === selected).transition(t).attr('transform', d => `translate(${d.y},${d.x})`)
    .select('circle:not(.alive)').attr('fill', d => d._children && !d.children ? 'var(--bg)' : color(d))
    .attr('stroke', 'var(--ac)');
  node.exit().transition(t).remove().attr('transform', `translate(${src.y},${src.x})`);
  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
  if (center) centerOn(center);
}
const diag = (s, t) => `M${s.y},${s.x}C${(s.y + t.y) / 2},${s.x} ${(s.y + t.y) / 2},${t.x} ${t.y},${t.x}`;
const p_key = d => d.data.key;
const toggle = d => { d.children = d.children ? null : d._children; };

function select(d) {
  selected = d;
  history.replaceState(null, '', '#' + p_key(d));
  renderPanel(d);
  update(d.owner || d);
}

function renderPanel(d) {
  const p = d.data, panel = document.getElementById('panel');
  panel.innerHTML = `<div class="tools"><button type="button" class="x" aria-label="Close">×</button></div>
    <h2>${esc(p.name)}</h2><dl>
    ${p.born ? `<dt>Born</dt><dd>${esc(p.born)}</dd>` : ''}
    ${p.died ? `<dt>Died</dt><dd>${esc(p.died)}</dd>` : ''}
    ${d.owner ? `<dt>Spouse in the descendant line</dt><dd>${esc(d.owner.data.name)}</dd>` : ''}
    ${p.spouses?.length ? `<dt>Spouses as listed</dt><dd>${p.spouses.map(s =>
      `<button type="button" data-key="${esc(s.key)}">${esc(s.name)}</button>`).join(' ')}</dd>` : ''}
    <dt>Report details</dt><dd>${esc(p.note).split('\n').map(n => `<p>${n}</p>`).join('')}</dd>
    <dt>Source</dt><dd>${p.sources.map(s => `<a href="${esc(s.url)}">${esc(s.label)}</a>`).join('<br>')}</dd>
    </dl>`;
  panel.setAttribute('aria-label', p.name);
  panel.style.display = 'block'; panel.scrollTop = 0;
  panel.querySelectorAll('[data-key]').forEach(button => button.onclick = () =>
    select(PEOPLE.find(p => p.data.key === button.dataset.key)));
  panel.querySelector('.x').onclick = () => { panel.style.display = 'none'; selected = null;
    history.replaceState(null, '', location.pathname + location.search); update(root); };
  panel.onkeydown = e => { if (e.key === 'Escape') panel.querySelector('.x').click(); };
}

function centerOn(d) {
  const {width, height} = svg.node().getBoundingClientRect();
  const k = d3.zoomTransform(svg.node()).k;
  svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(width / 3 - d.y * k, height / 2 - d.x * k).scale(k));
}
function fit() {
  const b = g.node().getBBox(), {width, height} = svg.node().getBoundingClientRect();
  const k = Math.min(1.2, .92 * Math.min(width / b.width, height / b.height));
  svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate((width - b.width * k) / 2 - b.x * k, (height - b.height * k) / 2 - b.y * k).scale(k));
}

document.getElementById('exp').onclick = e => { const on = e.target.getAttribute('aria-pressed') !== 'true';
  ALL.forEach(d => d.children = on || d.depth < 2 ? d._children : null); e.target.setAttribute('aria-pressed', on); e.target.textContent = tr(on ? 'Collapse all' : 'Expand all'); update(root); setTimeout(fit, 320); };
document.getElementById('fit').onclick = fit;
document.getElementById('q').addEventListener('change', e => {
  const v = e.target.value.trim().toLowerCase(); if (!v) return;
  const hit = PEOPLE.find(d => d.data.name.toLowerCase() === v)
           || PEOPLE.find(d => d.data.name.toLowerCase().includes(v));
  if (!hit) { document.getElementById('q').setCustomValidity('No matching person'); document.getElementById('q').reportValidity(); return; }
  (hit.owner || hit).ancestors().forEach(a => { if (a !== hit) a.children = a._children; });
  g.selectAll('g.node').classed('hit', false);
  select(hit);
  centerOn(hit.owner || hit);
  g.selectAll('g.node').filter(d => d === hit).classed('hit', true);
});
function openKey(k) {
  const hit = PEOPLE.find(d => p_key(d) === decodeURIComponent(k));
  if (!hit) return false;
  (hit.owner || hit).ancestors().forEach(a => { if (a !== hit) a.children = a._children; });
  select(hit); setTimeout(() => centerOn(hit.owner || hit), 320); return true;
}
document.getElementById('q').addEventListener('input', e => e.target.setCustomValidity(''));
root.x0 = 0; root.y0 = 0;
update(root);
if (!(location.hash && openKey(location.hash.slice(1)))) setTimeout(fit, 350);
window.addEventListener('resize', fit);
window.addEventListener('hashchange', () => {
  if (location.hash) openKey(location.hash.slice(1));
  else document.querySelector('#panel .x')?.click();
});
</script>
</body>
